<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — FUTSTATS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070a12">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <div id="sidebar-mount"></div>

  <div class="admin-main">
    <div id="topbar-mount"></div>
    <div class="admin-content" id="admin-content"></div>
  </div>
</div>

<!-- ===== Seções do painel (trocadas sem recarregar a página) ===== -->

<template id="tpl-dashboard">
  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="admin-panel" style="margin-bottom:20px;">
    <div class="admin-panel-header">
      <span class="admin-panel-title">Jogos ao vivo agora</span>
    </div>
    <table class="admin-table">
      <thead><tr><th scope="col">Fase</th><th scope="col">Confronto</th><th scope="col">Placar</th><th scope="col">Local</th></tr></thead>
      <tbody id="tbody-ao-vivo"></tbody>
    </table>
  </div>

  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-panel-title">Próximos jogos</span>
      <a href="#jogos" class="btn btn-ghost btn-sm">Gerenciar jogos</a>
    </div>
    <table class="admin-table">
      <thead><tr><th scope="col">Data</th><th scope="col">Fase</th><th scope="col">Confronto</th><th scope="col">Local</th></tr></thead>
      <tbody id="tbody-proximos"></tbody>
    </table>
  </div>
</template>

<template id="tpl-times">
  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-panel-title" id="titulo-times">Seleções cadastradas</span>
      <div style="display:flex;gap:10px;">
        <input type="text" class="search-input" id="busca" placeholder="Buscar...">
      </div>
    </div>
    <table class="admin-table">
      <thead>
        <tr id="cabecalho-times"><th scope="col">Seleção</th><th scope="col">Grupo</th><th scope="col">Confederação</th><th scope="col">Técnico</th><th scope="col">Ranking FIFA</th><th scope="col">Jogadores</th><th scope="col"></th></tr>
      </thead>
      <tbody id="tbody-times"></tbody>
    </table>
  </div>
</template>

<template id="tpl-jogadores">
  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-panel-title">Jogadores cadastrados</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="search-input" id="filtro-time" style="min-width:170px;"></select>
        <input type="text" class="search-input" id="busca" placeholder="Buscar jogador ou clube...">
        <button class="btn btn-primary" id="btn-novo">+ Novo jogador</button>
      </div>
    </div>
    <table class="admin-table">
      <thead>
        <tr><th scope="col">Nº</th><th scope="col">Jogador</th><th scope="col">Seleção</th><th scope="col">Posição</th><th scope="col">Clube</th><th scope="col">Idade</th><th scope="col">Status</th><th scope="col"></th></tr>
      </thead>
      <tbody id="tbody-jogadores"></tbody>
    </table>
  </div>
</template>

<template id="tpl-jogos">
  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-panel-title" id="titulo-jogos">Jogos</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="btn-novo">+ Novo jogo</button>
        <button class="btn btn-ghost" id="btn-importar">Importar calendário oficial</button>
        <button class="btn btn-ghost" id="btn-gerar" hidden>Gerar rodadas</button>
        <button class="btn btn-ghost" id="btn-sincronizar">Atualizar chaveamento</button>
        <button class="btn btn-ghost" id="btn-desfazer" disabled><i data-icone="voltar"></i> Desfazer</button>
        <button class="btn btn-ghost" id="btn-historico" disabled><i data-icone="relogio"></i> Histórico</button>
      </div>
    </div>
    <div class="admin-toolbar-hint" id="dica-jogos">
      Cadastre os jogos da fase de grupos (ou importe o calendário oficial, sem placares) e lance placar, gols, assistências e cartões em <strong>Editar</strong>.
      Os jogos do mata-mata são criados sozinhos quando os 12 grupos terminam.
    </div>
    <div class="admin-panel-header" style="border-top:none;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="search-input" id="filtro-fase" style="min-width:170px;"></select>
        <select class="search-input" id="filtro-grupo" style="min-width:130px;"></select>
        <select class="search-input" id="filtro-status" style="min-width:150px;">
          <option value="">Todos os status</option>
          <option value="agendado">Agendado</option>
          <option value="ao_vivo">Ao vivo</option>
          <option value="encerrado">Encerrado</option>
          <option value="adiado">Adiado</option>
        </select>
      </div>
    </div>
    <table class="admin-table">
      <thead>
        <tr><th scope="col">Data / Hora</th><th scope="col">Fase</th><th scope="col">Confronto</th><th scope="col">Placar</th><th scope="col">Lances</th><th scope="col">Status</th><th scope="col"></th></tr>
      </thead>
      <tbody id="tbody-jogos"></tbody>
    </table>
  </div>
</template>

<template id="tpl-dados">
  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-panel-title">Backup e publicação dos dados</span>
    </div>
    <div class="dados-grid">
      <div class="dados-card dados-nuvem" id="card-nuvem">
        <h3><i data-icone="globo"></i> Banco de dados (Supabase)</h3>
        <p id="nuvem-status">Verificando…</p>
        <div class="dados-nuvem-acoes">
          <button type="button" class="btn btn-primary" id="btn-nuvem-enviar" hidden>Enviar tudo para o banco</button>
          <button type="button" class="btn btn-ghost" id="btn-nuvem-baixar" hidden>Baixar do banco agora</button>
        </div>
      </div>
      <div class="dados-card">
        <h3><i data-icone="download"></i> Baixar backup</h3>
        <p>Salva seleções, jogadores e jogos (com gols, cartões e escalações) num arquivo <code>.json</code>. Os dados vivem só neste navegador — limpar o histórico apaga tudo, então guarde um backup de vez em quando.</p>
        <button type="button" class="btn btn-primary" id="btn-exportar">Baixar backup</button>
      </div>
      <div class="dados-card">
        <h3><i data-icone="upload"></i> Restaurar backup</h3>
        <p>Carrega um arquivo de backup e <strong>substitui</strong> tudo o que está cadastrado neste navegador. Serve também para levar os dados para outro computador.</p>
        <label class="btn btn-ghost" style="justify-content:center;">Escolher arquivo…<input type="file" id="arquivo-backup" accept=".json,application/json" hidden></label>
      </div>
      <div class="dados-card">
        <h3><i data-icone="globo"></i> Publicar para os visitantes</h3>
        <p>Gera o arquivo <code>dados.js</code>. Substitua o <code>js/dados.js</code> do projeto por ele e envie para o GitHub: quem abrir o site passa a ver estes jogos e estatísticas. Gere de novo a cada atualização.</p>
        <button type="button" class="btn btn-ghost" id="btn-publicar">Gerar dados.js</button>
      </div>
    </div>
    <div class="dados-status" id="dados-status"></div>
  </div>
</template>

<script src="js/elencos.js"></script>
<script src="js/clubes.js"></script>
<script src="js/competicoes-clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/calendario.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/config-nuvem.js"></script>
<script src="js/nuvem.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/times.js"></script>
<script src="js/jogadores.js"></script>
<script src="js/jogos.js"></script>
<script src="js/dados-admin.js"></script>
</body>
</html>
