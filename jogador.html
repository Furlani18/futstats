<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Jogador — FUTSTATS</title>
<script>try{var t=localStorage.getItem('fs_tema');if(t)document.documentElement.dataset.theme=t;var c=JSON.parse(localStorage.getItem('fs_cores')||'null');if(c)for(var k in c)document.documentElement.style.setProperty(k,c[k]);if(localStorage.getItem('fs_densidade')==='compacta')document.documentElement.dataset.densidade='compacta'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Estatísticas do jogador na Copa do Mundo FIFA 2026.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUTSTATS">
<meta property="og:title" content="Jogador — FUTSTATS">
<meta property="og:description" content="Estatísticas do jogador na Copa do Mundo FIFA 2026.">
<meta property="og:url" content="https://furlani18.github.io/futstats/jogador.html">
<meta property="og:image" content="https://furlani18.github.io/futstats/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>
<div id="ticker-mount"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb" id="breadcrumb"><a href="index.html">Início</a> / <span>Jogador</span></div>
    <div class="time-hero-grid">
    <div class="profile-head">
      <div id="avatar-mount"></div>
      <div>
        <div class="section-eyebrow" id="eyebrow-jogador"></div>
        <div class="titulo-favorito"><h1 class="section-title" id="nome-jogador"><span class="sr-only">Carregando…</span><span class="esqueleto esq-titulo" aria-hidden="true"></span></h1><button type="button" class="btn-favorito" id="btn-favorito" aria-pressed="false" hidden><i data-icone="estrela"></i></button></div>
        <div class="profile-facts" id="fatos-jogador"></div>
      </div>
    </div>
    <div class="hero-carta" id="carta-mount"></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="stat-tiles" id="tiles-jogador" style="margin-bottom:20px;"></div>
  <div class="graficos-2" id="graficos-jogador" hidden>
    <section class="panel" id="painel-perfil" hidden>
      <div class="panel-header"><span class="panel-title">Perfil no campeonato</span></div>
      <div class="grafico-caixa" id="grafico-perfil"></div>
      <p class="grafico-nota" id="nota-perfil"></p>
    </section>
    <section class="panel" id="painel-notas" hidden>
      <div class="panel-header"><span class="panel-title">Notas jogo a jogo</span><span class="campanha-resumo" id="resumo-notas"></span></div>
      <div class="grafico-caixa" id="grafico-notas"></div>
    </section>
  </div>
  <div class="grid-main">
    <section class="panel">
      <div class="panel-header"><span class="panel-title" id="titulo-lances">Lances no campeonato</span></div>
      <div id="lances"></div>
    </section>
    <aside class="panel">
      <div class="panel-header"><span class="panel-title">Ficha</span></div>
      <ul class="info-list" id="info-jogador"></ul>
    </aside>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/carregar-dados.js"></script>
<script src="js/competicoes-clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/jogador.js"></script>
</body>
</html>
