<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogadores — Painel Admin FUTSTATS</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <div id="sidebar-mount"></div>

  <div class="admin-main">
    <div id="topbar-mount"></div>

    <div class="admin-content">
      <div class="admin-panel">
        <div class="admin-panel-header">
          <span class="admin-panel-title">Jogadores cadastrados</span>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <select class="search-input" id="filtro-time" style="min-width:170px;"></select>
            <input type="text" class="search-input" id="busca" placeholder="Buscar jogador...">
            <button class="btn btn-primary" id="btn-novo">+ Novo jogador</button>
          </div>
        </div>
        <table class="admin-table">
          <thead>
            <tr><th>#</th><th>Jogador</th><th>Seleção</th><th>Posição</th><th>Idade</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tbody-jogadores"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/jogadores.js"></script>
</body>
</html>
