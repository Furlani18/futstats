<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Seleção — FUTSTATS</title>
<script>try{var t=localStorage.getItem('fs_tema');if(t)document.documentElement.dataset.theme=t;var c=JSON.parse(localStorage.getItem('fs_cores')||'null');if(c)for(var k in c)document.documentElement.style.setProperty(k,c[k]);if(localStorage.getItem('fs_densidade')==='compacta')document.documentElement.dataset.densidade='compacta'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Elenco, campanha e artilheiros da seleção na Copa do Mundo FIFA 2026.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUTSTATS">
<meta property="og:title" content="Seleção — FUTSTATS">
<meta property="og:description" content="Elenco, campanha e artilheiros da seleção na Copa do Mundo FIFA 2026.">
<meta property="og:url" content="https://furlani18.github.io/futstats/time.html">
<meta property="og:image" content="https://furlani18.github.io/futstats/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>
<div id="ticker-mount"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Início</a> / <a href="selecoes.html">Seleções</a> / <span id="breadcrumb-nome">Seleção</span></div>
    <div class="time-hero-grid">
      <div class="profile-head">
        <div id="flag-mount" class="time-hero-escudo"></div>
        <div>
          <div class="section-eyebrow" id="eyebrow-time"></div>
          <div class="titulo-favorito"><h1 class="section-title" id="nome-time"><span class="sr-only">Carregando…</span><span class="esqueleto esq-titulo" aria-hidden="true"></span></h1><button type="button" class="btn-favorito" id="btn-favorito" aria-pressed="false" title="Seguir este time" hidden><i data-icone="estrela"></i></button></div>
          <div class="profile-facts" id="fatos-time"></div>
        </div>
      </div>
      <div class="time-forma" id="forma-time" hidden></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="stat-tiles" id="tiles-time" style="margin-bottom:20px;"></div>

  <div class="panel" id="painel-campanha" style="margin-bottom:20px;" hidden>
    <div class="panel-header"><span class="panel-title">Campanha · posição rodada a rodada</span><span class="campanha-resumo" id="campanha-resumo"></span></div>
    <div class="campanha" id="grafico-campanha"></div>
  </div>

  <div class="panel" id="painel-jogo-a-jogo" style="margin-bottom:20px;" hidden>
    <div class="panel-header"><span class="panel-title">Jogo a jogo · gols marcados</span>
      <span class="gl-legenda" style="padding:0;"><span><i style="background:var(--accent)"></i>Vitória</span><span><i style="background:var(--text-faint)"></i>Empate</span><span><i style="background:var(--danger)"></i>Derrota</span></span></div>
    <div class="grafico-caixa" id="grafico-jogo-a-jogo"></div>
  </div>

  <div class="grid-main">
    <section class="panel">
      <div class="panel-header"><span class="panel-title">Elenco · <span id="qtd-elenco">26</span> convocados</span></div>
      <div id="elenco"></div>
    </section>

    <aside class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title" id="titulo-grupo">Grupo</span><a id="link-grupo" href="grupos.html">Ver grupos →</a></div>
        <div id="tabela-grupo"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Jogos</span></div>
        <div class="match-list" id="jogos-time"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Artilheiros da seleção</span></div>
        <div id="artilheiros-time"></div>
      </div>
    </aside>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/carregar-dados.js"></script>
<script src="js/competicoes-clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/time.js"></script>
</body>
</html>
