<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTSTATS — Copa do Mundo FIFA 2026</title>
<meta name="description" content="Resultados, classificação, artilharia, assistências e elencos da Copa do Mundo FIFA 2026.">
<script>try{var t=localStorage.getItem('fs_tema');if(t)document.documentElement.dataset.theme=t;var c=JSON.parse(localStorage.getItem('fs_cores')||'null');if(c)for(var k in c)document.documentElement.style.setProperty(k,c[k])}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070a12">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUTSTATS">
<meta property="og:title" content="FUTSTATS — Copa do Mundo FIFA 2026">
<meta property="og:description" content="Resultados, classificação, artilharia, assistências e elencos da Copa do Mundo FIFA 2026.">
<meta property="og:url" content="https://furlani18.github.io/futstats/">
<meta property="og:image" content="https://furlani18.github.io/futstats/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>
<div id="ticker-mount"></div>

<section class="hero">
  <img class="hero-marca" id="hero-marca" alt="" aria-hidden="true" hidden>
  <div class="container">
    <div class="hero-grid">
      <div class="hero-main">
        <div class="hero-brand">
          <div class="logo-plate logo-plate-xl" id="hero-logo" hidden></div>
          <div>
            <div class="section-eyebrow hero-live" id="hero-fase">Fase de grupos</div>
            <h1 class="hero-title" id="hero-titulo">Copa do Mundo<br><span class="gold">FIFA 2026</span></h1>
          </div>
        </div>
        <p class="hero-sub" id="hero-sub"><strong>Estados Unidos, México e Canadá</strong> · 11 de junho a 19 de julho de 2026</p>
        <div class="hero-chips" id="hero-chips"></div>
      </div>
      <div id="destaque"></div>
    </div>
    <div class="kpi-strip" id="kpis"></div>
  </div>
</section>

<main class="page">
  <div class="grid-main">
    <section class="stack">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title" id="titulo-jogos">Partidas</span>
          <a href="partidas.html">Todas as partidas →</a>
        </div>
        <div class="match-list" id="lista-jogos"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title" id="titulo-tabela">Grupos</span>
          <a href="grupos.html">Classificação completa →</a>
        </div>
        <div class="grid-2" id="mini-grupos" style="gap:0;"></div>
        <div id="legenda-grupos"></div>
      </div>
    </section>

    <aside class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Artilharia</span><a href="estatisticas.html">Ver tudo →</a></div>
        <div id="top-artilheiros"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Assistências</span><a href="estatisticas.html#assistencias">Ver tudo →</a></div>
        <div id="top-assistencias"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Melhores ataques</span><a href="estatisticas.html#selecoes">Ver tudo →</a></div>
        <div id="top-ataques"></div>
      </div>
    </aside>
  </div>

  <div class="section-head">
    <div>
      <div class="section-eyebrow" id="eyebrow-times">48 seleções · 12 grupos</div>
      <h2 class="section-title" id="titulo-times">Seleções</h2>
    </div>
    <a class="link-more" href="selecoes.html" id="link-times">Ver por confederação →</a>
  </div>
  <div class="team-grid" id="grid-times"></div>
</main>

<div id="footer-mount"></div>

<script src="js/elencos.js"></script>
<script src="js/clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
