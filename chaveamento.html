<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mata-mata — Copa do Mundo FIFA 2026 — FUTSTATS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>
<div id="ticker-mount"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Início</a> / <span>Mata-mata</span></div>
    <div class="section-eyebrow">Pela primeira vez com 32avos de final</div>
    <h1 class="section-title">Chaveamento</h1>
    <p class="lead">Confrontos tracejados ainda são projeções pela classificação atual — viram definitivos quando a fase anterior termina.</p>
  </div>
</section>

<main class="page">
  <div class="grid-2" style="margin-bottom:20px;">
    <div class="panel final-card">
      <div class="panel-header"><span class="panel-title">🏆 Final</span><span class="group-status">19/07 · MetLife Stadium</span></div>
      <div class="panel-body" id="bloco-final"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Disputa de 3º lugar</span><span class="group-status">18/07 · Miami</span></div>
      <div class="panel-body" id="bloco-terceiro"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><span class="panel-title">32avos → Semifinal</span></div>
    <div class="panel-body">
      <div class="bracket-wrap">
        <div class="bracket" id="bracket"></div>
      </div>
    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/elencos.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/chaveamento.js"></script>
</body>
</html>
