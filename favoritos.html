<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Meus favoritos — FUTSTATS</title>
<script>try{var t=localStorage.getItem('fs_tema');if(t)document.documentElement.dataset.theme=t;var c=JSON.parse(localStorage.getItem('fs_cores')||'null');if(c)for(var k in c)document.documentElement.style.setProperty(k,c[k])}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Times e jogadores que você segue, com os próximos jogos de todos os campeonatos.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUTSTATS">
<meta property="og:title" content="Meus favoritos — FUTSTATS">
<meta property="og:description" content="Times e jogadores que você segue, com os próximos jogos de todos os campeonatos.">
<meta property="og:url" content="https://furlani18.github.io/futstats/favoritos.html">
<meta property="og:image" content="https://furlani18.github.io/futstats/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>
<div id="ticker-mount"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Início</a> / <span>Favoritos</span></div>
    <div class="section-eyebrow">Em todos os campeonatos</div>
    <h1 class="section-title">Meus favoritos</h1>
    <p class="lead">Os times e jogadores que você segue (☆ na página de cada um), com os próximos jogos de todos os campeonatos num lugar só. Ficam salvos só neste navegador.</p>
  </div>
</section>

<main class="page">
  <div id="fav-vazio" hidden></div>
  <div class="grid-main" id="fav-conteudo" hidden>
    <section class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Próximos jogos dos seus times</span>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-ics-favoritos" hidden>📅 Exportar para a agenda (.ics)</button></div>
        <div class="match-list" id="fav-proximos"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Últimos resultados</span></div>
        <div class="match-list" id="fav-ultimos"></div>
      </div>
    </section>
    <aside class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Times</span><span class="campanha-resumo" id="fav-qtd-times"></span></div>
        <div id="fav-times"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Jogadores</span><span class="campanha-resumo" id="fav-qtd-jogadores"></span></div>
        <div id="fav-jogadores"></div>
      </div>
    </aside>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/carregar-dados.js"></script>
<script src="js/competicoes-clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/favoritos.js"></script>
</body>
</html>
