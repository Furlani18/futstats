<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Jogo — FUTSTATS</title>
<script>try{var t=localStorage.getItem('fs_tema');if(t)document.documentElement.dataset.theme=t;var c=JSON.parse(localStorage.getItem('fs_cores')||'null');if(c)for(var k in c)document.documentElement.style.setProperty(k,c[k]);if(localStorage.getItem('fs_densidade')==='compacta')document.documentElement.dataset.densidade='compacta'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Placar, lance a lance e escalações do jogo da Copa do Mundo FIFA 2026.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUTSTATS">
<meta property="og:title" content="Jogo — FUTSTATS">
<meta property="og:description" content="Placar, lance a lance e escalações do jogo da Copa do Mundo FIFA 2026.">
<meta property="og:url" content="https://furlani18.github.io/futstats/jogo.html">
<meta property="og:image" content="https://furlani18.github.io/futstats/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="topbar-mount"></div>

<section class="match-hero">
  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="match-hero-meta" id="meta-jogo"></div>
    <div class="match-hero-inner" id="hero-jogo"><span class="esqueleto esq-bandeira" aria-hidden="true"></span><span class="esqueleto esq-placar" aria-hidden="true"></span><span class="esqueleto esq-bandeira" aria-hidden="true"></span></div>
    <div class="scorers" id="autores"></div>
    <div class="share-row" id="compartilhar"></div>
  </div>
</section>

<main class="page">
  <div class="match-nav" id="nav-jogo" style="margin-bottom:20px;"></div>
  <div class="grid-main">
    <section class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Lance a lance</span></div>
        <div id="timeline"></div>
      </div>
      <div class="panel" id="painel-estatisticas" hidden>
        <div class="panel-header"><span class="panel-title">Estatísticas da partida</span></div>
        <div class="est-jogo" id="estatisticas-jogo"></div>
      </div>
      <div class="panel" id="painel-escalacoes" hidden>
        <div class="panel-header"><span class="panel-title">Escalações</span><div class="lu-abas" id="abas-escalacoes" role="tablist"></div></div>
        <div id="escalacoes"></div>
      </div>
      <div class="panel" id="painel-banco" hidden>
        <div id="banco"></div>
      </div>
    </section>

    <aside class="stack">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Informações</span></div>
        <ul class="info-list" id="info-jogo"></ul>
      </div>
      <div class="panel" id="painel-h2h" hidden>
        <div class="panel-header"><span class="panel-title">Retrospecto</span></div>
        <div class="h2h" id="corpo-h2h"></div>
      </div>
      <div class="panel" id="painel-lateral">
        <div class="panel-header"><span class="panel-title" id="titulo-lateral">Classificação</span><a id="link-lateral" href="grupos.html">Ver →</a></div>
        <div id="corpo-lateral"></div>
      </div>
    </aside>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/carregar-dados.js"></script>
<script src="js/competicoes-clubes.js"></script>
<script src="js/competicoes.js"></script>
<script src="js/dados.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/compartilhar.js"></script>
<script src="js/jogo.js"></script>
</body>
</html>
